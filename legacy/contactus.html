<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
<title> Wilmington Travel Agency </title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.2/css/fontawesome.min.css"
<meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no, viewport-fit=cover">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<section class="header">
<div class="container">
    <a href="index.html">
    <img alt="Wilmington Travel Agency" src="images/logo.png">
    </a>
    <button onclick="document.location= 'login.html'" type="button" class="login-btn">Login</button>

</div>
<h1>Wilmington Travel Agency</h1>
<p>Travel Unscripted</p>
<div class="input-group">
    <input type="text" class="form-control" placeholder="Search Country or City">
    <div class="input-group-append">
        <button type="submit" class="input-group-text btn">Search</button>.
    </div>
</section>
<div class="container">
    <div class="center">
        <form action="contactus.html">
  
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Name">
  
        <label for="email">Email Address</label>
        <input type="text" id="email" name="email" placeholder="Email Address">
  
        <label for="subject">Subject</label>
        <input type="text" id="subject" placeholder="subject">
  
        <label for="body">Body</label>
        <textarea id="body" name="body" placeholder="Type text here" style="height:200px"></textarea>
  
        <input type="submit" value="Submit">
  
        </form>
    </div>
</div>
<section class="footer">
    <div class="container">
        <div class="row">
            <div class="column">
                <h4>Features</h4>
                <p>Deals & Offers</p>
                <p>Customer Reviews</p>
                <p>Cancellation Policy</p>
            </div>
            <div class="column">
                <h4>Quick Contact</h4>
                <p><a href="contactus.html">Contact Us</a></p>
                <p><i class="fa fa-phone-square"></i>1-800-6305</p>
                <p><i class="fa fa-envelope"></i></i>customerservice@wta.com</p>
                <p><i class="fa fa-home"></i> 273 W Smith St Orlando, FL 32804</p>
            </div>
            <div class="column">
                <h4>Follow us on</h4>
                <p><i class="fa-brands fa-square-facebook"></i> Facebook</p>
                <p><i class="fa-brands fa-youtube"></i></i> YouTube</p>
                <p><i class="fa-brands fa-x-twitter"></i> Twitter</p>
            </div>
            </div>
            </div><hr>   
    </div>
    </section>
</body>
</html>
